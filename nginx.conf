# Behind Cloudflare Tunnel the visitor's connection is HTTPS but nginx itself is
# reached over plain HTTP. Pass on the scheme the visitor used so the server
# builds https:// links (for example the Strava callback address).
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Matches MAX_FILE_SIZE_MB. Without this nginx refuses any upload over 1 MB.
    client_max_body_size 25m;

    # Docker's internal DNS. Looking the server up per request (instead of once at
    # start-up) means nginx keeps working after the server container is rebuilt
    # and gets a new address, rather than answering 502 until nginx is restarted.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Serve static frontend files
    location / {
        # The same protections the API sends, applied to the page itself.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; worker-src 'self' blob:; child-src 'self' blob:; img-src 'self' data: blob: https://*.mapbox.com https://developers.strava.com; connect-src 'self' https://*.mapbox.com https://api.mapbox.com https://events.mapbox.com; style-src 'self' 'unsafe-inline' https://api.mapbox.com; font-src 'self' https://api.mapbox.com; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; object-src 'none'" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the Express server
    location /api/ {
        set $api_upstream http://server:3001;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
}
