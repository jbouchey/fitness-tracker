services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: trailtracker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: fitness_tracker
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trailtracker -d fitness_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://trailtracker:${POSTGRES_PASSWORD}@postgres:5432/fitness_tracker
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      PORT: 3001
      NODE_ENV: production
      CLIENT_URL: ${CLIENT_URL}
      APP_URL: ${APP_URL}
      # Keep in step with client_max_body_size in nginx.conf
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-25}
      # Proxies in front of the server: nginx alone = 1, Cloudflare Tunnel + nginx = 2
      TRUST_PROXY: ${TRUST_PROXY:-2}
      # Set to "false" to stop new sign-ups
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      # Set to "true" so new accounts must confirm their email before uploading
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-false}
      UPLOADS_PER_HOUR: ${UPLOADS_PER_HOUR:-30}
      EMAIL_FROM: ${EMAIL_FROM:-}
      RESEND_API_KEY: ${RESEND_API_KEY}
      STRAVA_CLIENT_ID: ${STRAVA_CLIENT_ID}
      STRAVA_CLIENT_SECRET: ${STRAVA_CLIENT_SECRET}
      STRAVA_WEBHOOK_VERIFY_TOKEN: ${STRAVA_WEBHOOK_VERIFY_TOKEN}
      STRAVA_WEBHOOK_SUBSCRIPTION_ID: ${STRAVA_WEBHOOK_SUBSCRIPTION_ID:-}
    expose:
      - "3001"

  client:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "8090:80"
    volumes:
      - ./client/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
